<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 712" width="640" height="712" role="img" aria-labelledby="wf-title wf-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="wf-title">How the figure-design plugin works</title>
  <desc id="wf-desc">Six stages from top to bottom. 1, agree on the content of each view; you confirm the outline. 2, design the flow, then draw one static SVG per view. 3, inspect the rendered figure, with an independent design review for substantial figures. 4, approve each SVG; you approve every view before anything is interactive. A static-only figure ends here. 5 and 6, only if you ask for interactivity: 5, add hover, tap and keyboard interactivity without changing the approved figure; 6, verify, say which tests were on real devices and which were simulated, and deliver the files, with a Quarto example when wanted.</desc>
  <defs>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="640" height="712" fill="#ffffff"/>

  <!-- Arrows between stages: centre line x = 320 -->
  <g stroke="#1f3a5f" stroke-width="2" fill="none" marker-end="url(#wf-arrow)">
    <line x1="320" y1="108" x2="320" y2="132"/>
    <line x1="320" y1="222" x2="320" y2="246"/>
    <line x1="320" y1="336" x2="320" y2="360"/>
  </g>
  <g stroke="#1f3a5f" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#wf-arrow)">
    <line x1="320" y1="450" x2="320" y2="474"/>
    <line x1="320" y1="564" x2="320" y2="588"/>
  </g>

  <!-- Stage 1 -->
  <rect x="40" y="20" width="560" height="88" rx="12" fill="#e3effb" stroke="#9cc2ea" stroke-width="1.5"/>
  <circle cx="78" cy="64" r="20" fill="#1f3a5f"/>
  <text x="78" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="114" y="56" font-size="17" font-weight="700" fill="#1f3a5f">Agree on the content</text>
  <text x="114" y="81" font-size="13.5" fill="#33475b">What each view explains, as a plain outline</text>
  <rect x="470" y="50" width="114" height="28" rx="14" fill="#1f3a5f"/>
  <text x="527" y="69" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">You confirm</text>

  <!-- Stage 2 -->
  <rect x="40" y="134" width="560" height="88" rx="12" fill="#e6f4ea" stroke="#9fd3ae" stroke-width="1.5"/>
  <circle cx="78" cy="178" r="20" fill="#1f3a5f"/>
  <text x="78" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="114" y="170" font-size="17" font-weight="700" fill="#1f3a5f">Design the flow, then the SVG</text>
  <text x="114" y="195" font-size="13.5" fill="#33475b">Layout from the relationships; one static SVG per view</text>

  <!-- Stage 3 -->
  <rect x="40" y="248" width="560" height="88" rx="12" fill="#fdf0e1" stroke="#f0c48f" stroke-width="1.5"/>
  <circle cx="78" cy="292" r="20" fill="#1f3a5f"/>
  <text x="78" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="114" y="284" font-size="17" font-weight="700" fill="#1f3a5f">Inspect and review</text>
  <text x="114" y="309" font-size="13.5" fill="#33475b">Checks on the render; independent review if substantial</text>

  <!-- Stage 4 -->
  <rect x="40" y="362" width="560" height="88" rx="12" fill="#efe8f8" stroke="#c4b2e6" stroke-width="1.5"/>
  <circle cx="78" cy="406" r="20" fill="#1f3a5f"/>
  <text x="78" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
  <text x="114" y="398" font-size="17" font-weight="700" fill="#1f3a5f">Approve each SVG</text>
  <text x="114" y="423" font-size="13.5" fill="#33475b">Each view shown in the chat for approval</text>
  <rect x="470" y="392" width="114" height="28" rx="14" fill="#1f3a5f"/>
  <text x="527" y="411" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">You approve</text>

  <!-- Stage 5: only when requested (dashed) -->
  <rect x="40" y="476" width="560" height="88" rx="12" fill="#fbe9ee" stroke="#e8a7b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="78" cy="520" r="20" fill="#1f3a5f"/>
  <text x="78" y="526" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">5</text>
  <text x="114" y="512" font-size="17" font-weight="700" fill="#1f3a5f">Add interactivity</text>
  <text x="114" y="537" font-size="13.5" fill="#33475b">Hover, tap and keyboard, without changing the figure</text>
  <text x="584" y="512" text-anchor="end" font-size="12.5" font-style="italic" fill="#7a4a58">if you ask</text>

  <!-- Stage 6: with stage 5 (dashed) -->
  <rect x="40" y="590" width="560" height="88" rx="12" fill="#e2f3f5" stroke="#5fa9b3" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="78" cy="634" r="20" fill="#1f3a5f"/>
  <text x="78" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">6</text>
  <text x="114" y="626" font-size="17" font-weight="700" fill="#1f3a5f">Verify and deliver</text>
  <text x="584" y="626" text-anchor="end" font-size="12.5" font-style="italic" fill="#2f6670">with stage 5</text>
  <text x="114" y="651" font-size="13.5" fill="#33475b">Report what was tested and how; hand over the files</text>

  <text x="40" y="702" font-size="12" fill="#5c6b7a">Dark pills: steps that wait for you. Dashed: only if you ask. Static only: ends at 4.</text>
</svg>
